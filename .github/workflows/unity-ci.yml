name: Unity CI (compile + EditMode tests)

# Unity's asset-import pass compiles every script in the project, so "the project
# imported" == "the C# compiles". This workflow fails on any `error CS` and then runs
# the retained EditMode suites.
#
# Licensing uses RageAgainstThePixel/activate-unity-license. Its action.yml declares a
# `post:` handler, which is what returns the Personal seat when the job ends - do not
# pin it to a mutable tag like @main, or that cleanup can change under you.
#
# Read the preflight job first: this repo deliberately cannot compile as cloned,
# because FMOD for Unity is gitignored (TECHMANIA/.gitignore) while
# Assets/Scripts/Fmod/*.cs depends on its `FMOD.*` types.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'TECHMANIA/Assets/**/*.cs'
      - 'TECHMANIA/Assets/Plugins/**'
      - 'TECHMANIA/Packages/**'
      - 'TECHMANIA/ProjectSettings/**'
      - '.github/workflows/unity-ci.yml'
  push:
    branches: [master]

# A Personal seat is held for the whole job; never let two runs race for it.
# Deliberately NOT cancel-in-progress: a run is ~20-40 min of import plus one of the
# seat's limited daily activations, so cancelling finished work costs more than queueing.
concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_PATH: TECHMANIA
  # Only informational - buildalon/unity-setup resolves the real version from
  # ProjectVersion.txt via `version-file`, so these cannot silently drift apart.
  BUILD_TARGET: StandaloneWindows64

jobs:
  preflight:
    name: Preflight (FMOD + credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Summarise prerequisites
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          FMOD_REPO: ${{ vars.FMOD_RESTORE_REPO }}
          FMOD_TOKEN: ${{ secrets.FMOD_RESTORE_TOKEN }}
          FMOD_TOKEN_VAR: ${{ vars.FMOD_RESTORE_TOKEN }}
        run: |
          # Name each item separately: "FMOD missing" sent people hunting through four
          # settings pages when only one of them was wrong.
          rows=()
          missing=0
          chk() {
            if [ -n "$2" ]; then
              rows+=("| \`$1\` | $3 | present |")
            else
              rows+=("| \`$1\` | $3 | **MISSING** |")
              missing=1
            fi
          }
          chk FMOD_RESTORE_REPO   "$FMOD_REPO"     "variable"
          chk FMOD_RESTORE_TOKEN  "$FMOD_TOKEN"    "secret"
          chk UNITY_USERNAME      "$UNITY_USERNAME" "secret"
          chk UNITY_PASSWORD      "$UNITY_PASSWORD" "secret"

          if [ -d "$PROJECT_PATH/Assets/Plugins/FMOD" ]; then
            rows+=("| FMOD for Unity | in the tree | already committed |")
          elif [ -n "$FMOD_REPO" ] && [ -n "$FMOD_TOKEN" ]; then
            rows+=("| FMOD for Unity | restore source | \`$FMOD_REPO\` |")
          else
            rows+=("| FMOD for Unity | **unavailable** | see note below |")
          fi

          {
            echo "### Unity CI prerequisites"
            echo
            echo "| item | where it lives | status |"
            echo '|---|---|---|'
            printf '%s\n' "${rows[@]}"
            echo
            echo "CI reads these from \`${{ github.repository }}\` only - a variable set on"
            echo "the deps repo, or filed as an *environment* variable instead of a"
            echo "repository one, is invisible to this run."
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotations, not just the summary: the summary is only readable in the web
          # UI, and "which one is missing" is the whole question at this point.
          if [ -z "$FMOD_REPO" ]; then
            echo "::error::FMOD_RESTORE_REPO is unset - it must be a repository VARIABLE (Settings -> Secrets and variables -> Actions -> Variables tab) on ${{ github.repository }}"
          fi
          if [ -z "$FMOD_TOKEN" ]; then
            echo "::error::FMOD_RESTORE_TOKEN is unset - it must be a repository SECRET (Settings -> Secrets and variables -> Actions -> Secrets tab) on ${{ github.repository }}"
          fi

          # The two tabs look interchangeable and are not: a token saved under Variables is
          # stored in plain text, is not masked in logs, and is invisible to secrets.*.
          if [ -z "$FMOD_TOKEN" ] && [ -n "$FMOD_TOKEN_VAR" ]; then
            echo "::error::FMOD_RESTORE_TOKEN was filed as a VARIABLE (visible in the Variables tab). It must be a SECRET: delete that row, then on the Secrets tab add FMOD_RESTORE_TOKEN with the same value. Variables are plaintext and unmasked; secrets are neither."
            exit 1
          fi

          if [ ! -d "$PROJECT_PATH/Assets/Plugins/FMOD" ] && \
             { [ -z "$FMOD_REPO" ] || [ -z "$FMOD_TOKEN" ]; }; then
            cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          FMOD for Unity cannot be restored, so `Assets/Scripts/Fmod/*.cs` has no `FMOD.*`
          types to compile against and a compile check would be meaningless. Two ways out:

          1. Set both `FMOD_RESTORE_REPO` (variable) and `FMOD_RESTORE_TOKEN` (secret) on
             **this** repo - `Settings -> Secrets and variables -> Actions`, and note the
             two tabs. Runbook: `.github/UNITY-CI-SETUP.md` section 3.
          2. Nothing else is required for licensing at this point; `UNITY_USERNAME` and
             `UNITY_PASSWORD` above are the whole of it.
          EOF
            echo "::error::FMOD unavailable - check FMOD_RESTORE_REPO (variable) and FMOD_RESTORE_TOKEN (secret) on ${{ github.repository }}."
            exit 1
          fi

          if [ "$missing" = 1 ]; then
            echo "::error::a required secret or variable is unset (see the job summary table)."
            exit 1
          fi

  unity:
    name: Compile + EditMode tests
    needs: preflight
    # Only run for PRs from this repo, never from a fork: fork runs cannot read
    # secrets, and a PR that edits the workflow should not get a shot at them.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 1,031 committed cache files (208 MB) buy Unity nothing - the one under
      # Assets/ would be imported as a TextAsset - and they are pure import noise.
      - name: Drop the committed graphify cache
        run: |
          rm -rf "$PROJECT_PATH/graphify-out" "$PROJECT_PATH/Assets/Scripts/graphify-out"
          du -sh "$PROJECT_PATH"

      # FMOD lives in a small PRIVATE sibling repo (its licence forbids putting it in a
      # public one). A committed file rather than a release asset: the tag on a release has
      # to be spelled identically in two places, which is the most common way this breaks.
      - name: Fetch the deps repo
        if: ${{ vars.FMOD_RESTORE_REPO != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.FMOD_RESTORE_REPO }}
          token: ${{ secrets.FMOD_RESTORE_TOKEN }}
          path: .fmod-deps
          fetch-depth: 1

      - name: Unpack FMOD for Unity
        env:
          # via env:, not inline ${{ }}: the expression is pasted into the script text
          # before bash sees it, so a stray quote in the value would become syntax.
          FMOD_REPO: ${{ vars.FMOD_RESTORE_REPO }}
        run: |
          [ -d "$PROJECT_PATH/Assets/Plugins/FMOD" ] && exit 0
          [ -d .fmod-deps ] || {
            echo "::error::no FMOD in the tree and FMOD_RESTORE_REPO ('$FMOD_REPO') is unusable"
            exit 1
          }
          # Any archive will do - this repo exists only to hold this one file, so there
          # is nothing to confuse it with, and Explorer's default name is FMOD.zip.
          archive=$(find .fmod-deps -maxdepth 2 -type f \
                      \( -iname '*.zip' -o -iname '*.tar.gz' -o -iname '*.tgz' \) | sort | head -1)
          if [ -z "$archive" ]; then
            echo "::error::no .zip / .tar.gz committed at the top of $FMOD_REPO"
            echo "contents were:"; find .fmod-deps -maxdepth 1 -type f
            exit 1
          fi
          echo "unpacking $archive"
          mkdir -p "$PROJECT_PATH/Assets/Plugins"
          case "$archive" in
            *.zip)
              # Explorer roots a zipped folder at <folder>/, which is what we need.
              # Expand-Archive is a Windows program, so it needs Windows paths, not msys.
              winzip=$(cygpath -w "$archive")
              windst=$(cygpath -w "$PROJECT_PATH/Assets/Plugins")
              powershell -NoProfile -Command \
                "Expand-Archive -LiteralPath '$winzip' -DestinationPath '$windst' -Force"
              ;;
            *) tar -xzf "$archive" -C "$PROJECT_PATH/Assets/Plugins" ;;
          esac
          if [ ! -d "$PROJECT_PATH/Assets/Plugins/FMOD" ]; then
            echo "::error::archive had no top-level FMOD/ folder - zip the folder itself, not its contents"
            echo "the archive contained:"; tar -tzf "$archive" 2>/dev/null | head -5 \
              || python3 -c "import zipfile;print('\n'.join(zipfile.ZipFile(r'$archive').namelist()[:5]))" 2>/dev/null
            exit 1
          fi
          # after the check, so a bad archive still leaves the file to look at
          rm -rf .fmod-deps
          echo "FMOD restored: $(find "$PROJECT_PATH/Assets/Plugins/FMOD" -name '*.cs' | wc -l) scripts."

      # Resolves 6000.3.9f1 from ProjectVersion.txt, so the editor can never drift
      # from what the project was last saved with. Caches the installation itself.
      - name: Install Unity
        uses: buildalon/unity-setup@v2.6.0
        id: unity-setup
        with:
          version-file: ${{ env.PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt
          build-targets: ${{ env.BUILD_TARGET }}
          cache-installation: true

      - name: Activate Unity license
        id: license
        uses: RageAgainstThePixel/activate-unity-license@v2.2.2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: '6.x'

      # The Library is the slow part. This one step both restores (exact key, else the
      # newest prefix match) and re-saves in its post phase. Keyed on ProjectVersion.txt
      # as well, because a Library written by a different editor version is worse than no
      # cache at all.
      - name: Restore Library cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: library-${{ runner.os }}-${{ hashFiles(format('{0}/ProjectSettings/ProjectVersion.txt', env.PROJECT_PATH), format('{0}/Packages/packages-lock.json', env.PROJECT_PATH)) }}
          restore-keys: |
            library-${{ runner.os }}-

      - name: Prepare results dir
        run: mkdir -p "$PROJECT_PATH/TestResults"

      # This step alone is the compile check.
      - name: Unity import (= script compilation)
        id: import
        uses: buildalon/unity-action@v3.1.0
        with:
          log-name: import
          build-target: ${{ env.BUILD_TARGET }}
          args: '-quit -batchmode -nographics'

      # Kept separate and non-blocking: a failure here means "tests could not run"
      # (e.g. nunit not referenced into Assembly-CSharp-Editor), which is NOT the same
      # as "the project does not compile". See .github/UNITY-CI-SETUP.md for the
      # Tests.asmdef fix.
      - name: EditMode tests
        id: tests
        continue-on-error: true
        uses: buildalon/unity-action@v3.1.0
        with:
          log-name: tests
          build-target: ${{ env.BUILD_TARGET }}
          args: >-
            -quit -batchmode -nographics -runTests -testPlatform EditMode
            -testResults "${{ github.workspace }}/${{ env.PROJECT_PATH }}/TestResults/editmode.xml"

      - name: Fail on any script compile error
        if: always()
        run: |
          found=0
          # unity-action names the log from `log-name`, and its working directory is
          # not documented, so search for logs instead of assuming where they landed.
          logs=$(find . -maxdepth 4 -name '*.log' -type f 2>/dev/null | head -20)
          echo "candidate logs:"; echo "$logs"
          while IFS= read -r log; do
            [ -n "$log" ] || continue
            if grep -nE 'error CS[0-9]+' "$log" > /tmp/cs-errors.txt; then
              found=1
              echo "--- $log"
              head -40 /tmp/cs-errors.txt
              {
                echo "### \`error CS\` in $log"
                echo '```'
                head -60 /tmp/cs-errors.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done <<< "$logs"
          if [ "$found" = 1 ]; then exit 1; fi
          echo "No script compilation errors."
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "::warning::Project compiles, but EditMode tests did not complete - check Logs/tests.log."
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-results
          path: |
            **/*.log
            ${{ env.PROJECT_PATH }}/TestResults
          if-no-files-found: warn
          retention-days: 7
